<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TB Decision Support · Assam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='7' fill='%232563EB'/%3E%3Ccircle cx='15' cy='15' r='6' fill='none' stroke='white' stroke-width='1.8'/%3E%3Cpath d='M9.5 15h11M15 9.5v11' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ===================================================================== tokens */
:root{
  --font:-apple-system,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#F1F5F9;
  --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --ink-3:#94A3B8;
  --line:#E2E8F0; --line-2:#F1F5F9;
  --navy:#1B3A6B; --navy-2:#16315C; --side-ink:#FFFFFF;
  --accent:#2563EB; --accent-2:#1D4ED8; --accent-tint:#EFF6FF; --accent-line:#DBEAFE; --accent-soft:#60A5FA;
  --high:#DC2626; --high-dot:#DC2626; --high-tint:#FEE2E2; --high-line:#FECACA; --high-bg:#FFFAFA; --high-row:#FEF2F2;
  --med:#D97706; --med-dot:#F59E0B; --med-tint:#FEF3C7; --med-line:#FDE68A; --med-bg:#FFFBEB; --med-ink:#92400E;
  --ok:#16A34A; --ok-ink:#15803D; --ok-tint:#F0FDF4; --ok-line:#BBF7D0;
  --syn:#6D28D9; --syn-tint:#F5F3FF; --syn-line:#DDD6FE;
  --c1:#2563EB; --c2:#D97706; --c0:#94A3B8;
  --focus:#2563EB; --shadow:0 1px 2px rgba(15,23,42,.04); --pop:0 12px 32px rgba(15,23,42,.16);
  --side-w:232px; --head-h:58px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --surface:#111A2B; --surface-2:#0E1626; --surface-3:#16213A;
    --ink:#E2E8F0; --ink-2:#CBD5E1; --muted:#94A3B8; --ink-3:#64748B;
    --line:#1F2C44; --line-2:#18233A;
    --navy:#0A1630; --navy-2:#0D1C3B;
    --accent:#3B82F6; --accent-2:#60A5FA; --accent-tint:#13213F; --accent-line:#1E3A6E; --accent-soft:#60A5FA;
    --high:#F87171; --high-dot:#EF4444; --high-tint:#3A1518; --high-line:#5B1D22; --high-bg:#1A1218; --high-row:#24141A;
    --med:#FBBF24; --med-dot:#F59E0B; --med-tint:#36260B; --med-line:#5A3F0E; --med-bg:#1C170D; --med-ink:#FCD34D;
    --ok:#4ADE80; --ok-ink:#4ADE80; --ok-tint:#0E2A1A; --ok-line:#14532D;
    --syn:#A78BFA; --syn-tint:#1E1838; --syn-line:#3B2F6B;
    --c1:#3B82F6; --c2:#D97706; --c0:#475569;
    --focus:#60A5FA; --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
  }
  :root:not([data-theme="light"]) .avatar{background:var(--accent)}
}
:root[data-theme="dark"] .avatar{background:var(--accent)}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#111A2B; --surface-2:#0E1626; --surface-3:#16213A;
  --ink:#E2E8F0; --ink-2:#CBD5E1; --muted:#94A3B8; --ink-3:#64748B;
  --line:#1F2C44; --line-2:#18233A;
  --navy:#0A1630; --navy-2:#0D1C3B;
  --accent:#3B82F6; --accent-2:#60A5FA; --accent-tint:#13213F; --accent-line:#1E3A6E; --accent-soft:#60A5FA;
  --high:#F87171; --high-dot:#EF4444; --high-tint:#3A1518; --high-line:#5B1D22; --high-bg:#1A1218; --high-row:#24141A;
  --med:#FBBF24; --med-dot:#F59E0B; --med-tint:#36260B; --med-line:#5A3F0E; --med-bg:#1C170D; --med-ink:#FCD34D;
  --ok:#4ADE80; --ok-ink:#4ADE80; --ok-tint:#0E2A1A; --ok-line:#14532D;
  --syn:#A78BFA; --syn-tint:#1E1838; --syn-line:#3B2F6B;
  --c1:#3B82F6; --c2:#D97706; --c0:#475569;
  --focus:#60A5FA; --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
}

/* ===================================================================== base */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--head-h) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--font);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700;color:var(--ink)}
h2{font-size:14px} h3{font-size:13.5px}
p{margin:0 0 .5rem}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.grow{flex:1 1 auto}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.muted{color:var(--muted)} .small{font-size:11.5px} .mono{font-family:var(--mono);font-size:12px;letter-spacing:.01em}
.num{font-weight:700}

/* ===================================================================== shell */
.app{display:flex;min-height:100vh}
#side{width:var(--side-w);flex:none;background:var(--navy);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.side-brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand-row b{display:block;font-size:13px;font-weight:700;line-height:1.1;color:#fff}
.brand-row small{display:block;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.scope-box{background:rgba(255,255,255,.09);border-radius:6px;padding:6px 10px;border:0;width:100%;text-align:left;color:inherit;cursor:pointer;display:block}
.scope-box:hover{background:rgba(255,255,255,.14)}
.scope-box small{display:block;color:rgba(255,255,255,.5);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.scope-box b{display:block;color:#fff;font-size:12.5px;font-weight:600;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-nav{padding:10px 0;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 16px;border:0;border-left:3px solid transparent;background:none;color:rgba(255,255,255,.65);font-size:13px;cursor:pointer;text-align:left}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.7}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-item[aria-current="page"]{color:#fff;font-weight:600;background:rgba(96,165,250,.13);border-left-color:var(--accent-soft)}
.nav-item[aria-current="page"] svg{opacity:1;color:var(--accent-soft)}
.nav-item.sub{font-size:12.5px;color:rgba(255,255,255,.45);padding:8px 16px}
.nav-badge{margin-left:auto;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.75);min-width:22px;text-align:center}
.nav-badge.high{background:#DC2626;color:#fff} .nav-badge.med{background:#D97706;color:#fff}
.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:8px 16px}
.side-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.35);font-size:9.5px;text-align:center;line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
#head{position:sticky;top:0;z-index:20;height:var(--head-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.head-title{flex:1;min-width:0}
.head-title small{display:block;font-size:11px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-title h1{font-size:16px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-right{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.pill.live{background:var(--ok-tint);border-color:var(--ok-line);color:var(--ok-ink)} .pill.live i{background:var(--ok)}
.pill.high{background:var(--high-tint);border-color:var(--high-line);color:var(--high)} .pill.high i{background:var(--high-dot)}
.pill.med{background:var(--med-tint);border-color:var(--med-line);color:var(--med)} .pill.med i{background:var(--med-dot)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:22px;padding:4px 12px 4px 5px;cursor:pointer;max-width:260px}
.user-chip:hover{border-color:var(--accent)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.user-chip span{font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip span.avatar{color:#fff;font-size:10.5px;font-weight:700;overflow:visible}
.user-chip svg{width:12px;height:12px;color:var(--ink-3);flex:none}
#menu-btn{display:none}
.content{flex:1;padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}
#view.busy{opacity:.55;transition:opacity .15s;pointer-events:none}
.foot{padding:4px 22px 28px;color:var(--muted);font-size:11.5px}
.foot .row{gap:6px 16px}

/* user menu */
#umenu{position:fixed;top:calc(var(--head-h) - 4px);right:16px;width:300px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);z-index:50;display:none;overflow:hidden}
#umenu.open{display:block}
.um-sec{padding:12px 14px;border-bottom:1px solid var(--line-2)}
.um-sec:last-child{border-bottom:0}
.um-h{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.um-who b{display:block;font-size:13px} .um-who span{font-size:11.5px;color:var(--muted)}
.um-roles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.um-roles button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 8px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left}
.um-roles button[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-2)}
.um-sec select{width:100%;margin-top:8px}
.um-actions{display:flex;flex-wrap:wrap;gap:6px}

/* ===================================================================== cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.card-hd h2,.card-hd h3{font-size:14px;font-weight:700}
.card-hd .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.card-hd .right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card-bd{padding:14px 16px}
.card-bd.flush{padding:0}
.card-ft{padding:8px 16px;background:var(--accent-tint);border-top:1px solid var(--accent-line);color:var(--accent-2);font-size:11px}
.card-ft.plain{background:var(--surface-2);border-top-color:var(--line-2);color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:0;white-space:nowrap}
.link:hover{text-decoration:underline}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.panel>h3,.panel .card-h h3{margin-bottom:4px}
.card-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
.lede{color:var(--muted);font-size:12.5px;max-width:95ch;margin:0}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.cols-15{display:grid;gap:14px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.sec{display:flex;flex-direction:column;gap:0}
.cols.sec{display:grid}
svg.chart{max-height:420px}
.sec-hd{display:flex;align-items:flex-end;gap:10px;margin:6px 2px 10px}
.sec-hd h2{font-size:14px} .sec-hd .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.sec-hd .right{margin-left:auto;display:flex;gap:8px}
/* tables run edge to edge inside a card body */
.card-bd>.dt{margin:0 -16px}
.card-bd>.dt:first-child{margin-top:-14px}
.card-bd>.dt:last-child{margin-bottom:-14px}
.card-bd>.filters{margin-bottom:12px}
.card-bd>.lg{margin-bottom:10px}
.card-bd>.dt>.count:first-child{border-top:1px solid var(--line-2)}
.card-bd>.dt:first-child>.count:first-child{border-top:0}
.card-bd>p.small{margin:12px 0 0}

/* stat cards */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0;font:inherit;color:inherit}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--accent)}
.kpi .l{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi .v{font-size:28px;font-weight:800;color:var(--ink);line-height:1.05;letter-spacing:-.01em}
.kpi .s{font-size:11px;color:var(--muted);margin-top:5px}
.kpi.high{border-color:var(--high-line)} .kpi.high .l,.kpi.high .v{color:var(--high)}
.kpi.med{border-color:var(--med-line)} .kpi.med .l,.kpi.med .v{color:var(--med)}
.kpi.ok .v{color:var(--ok)} .kpi.brand .v{color:var(--navy)}
:root[data-theme="dark"] .kpi.brand .v{color:var(--accent-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kpi.brand .v{color:var(--accent-2)}}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* badges */
.prov{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.prov.real{background:var(--accent-tint);color:var(--accent-2);border:1px solid var(--accent-line)}
.prov.syn{background:var(--syn-tint);color:var(--syn);border:1px dashed var(--syn-line)}
.tier,.pri{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.tier.high,.pri.supervise_first{background:var(--high-tint);color:var(--high)}
.tier.medium,.pri.watch{background:var(--med-tint);color:var(--med)}
.tier.standard,.pri.routine{background:var(--ok-tint);color:var(--ok)}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
.lvl i{width:7px;height:7px;border-radius:50%;flex:none}
.lvl.high{color:var(--high)} .lvl.high i{background:var(--high-dot)}
.lvl.medium{color:var(--med)} .lvl.medium i{background:var(--med-dot)}
.lvl.standard{color:var(--ok)} .lvl.standard i{background:var(--ok)}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;background:var(--surface-3);color:var(--ink-2);margin:0 4px 4px 0;line-height:1.5}
.chip small{color:var(--muted);font-size:10px}
.chip.reason{background:var(--med-tint);color:var(--med-ink)}
.chip.ok{background:var(--ok-tint);color:var(--ok-ink)}
.chip.no{background:var(--high-tint);color:var(--high);text-decoration:line-through}
.chip.done{background:var(--accent-tint);color:var(--accent-2);font-weight:700;white-space:nowrap}
.trend{font-weight:700;white-space:nowrap;font-size:12px}
.trend.rising{color:var(--high)} .trend.falling{color:var(--ok)} .trend.stable{color:var(--muted)}

/* callouts */
.callout{border:1px solid var(--accent-line);background:var(--accent-tint);color:var(--ink-2);padding:10px 14px;border-radius:8px;font-size:12.5px}
.callout b{color:var(--ink)}
.callout.warn{border-color:var(--med-line);background:var(--med-bg);color:var(--med-ink)}
.callout.warn b{color:var(--med-ink)}
.callout.stop{border-color:var(--high-line);background:var(--high-bg);color:var(--high)}
.warnline{font-size:11.5px;color:var(--med-ink);background:var(--med-bg);border:1px solid var(--med-line);border-radius:6px;padding:8px 10px}

/* attention list */
.attn{list-style:none;margin:0;padding:0}
.attn li{display:grid;grid-template-columns:52px 1fr;gap:2px 12px;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.attn li:last-child{border-bottom:0}
.attn li.go{cursor:pointer} .attn li.go:hover{background:var(--surface-2)}
.attn .n{font-size:20px;font-weight:800;line-height:1.1;text-align:right;color:var(--ink)}
.attn .t{font-size:12.5px;color:var(--ink-2)} .attn .t b{color:var(--ink)}
.attn .s{grid-column:2;font-size:11px;color:var(--muted)}

/* steps / facts */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:1px 12px}
.steps li::before{counter-increment:s;content:counter(s);grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--accent-tint);color:var(--accent-2);font-weight:800;display:grid;place-items:center;font-size:11px}
.steps b{font-size:12.5px} .steps span{font-size:11.5px;color:var(--muted)}
.steps li.human::before{content:"✓";background:var(--ok-tint);color:var(--ok)}
.facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.fact .v{font-size:22px;font-weight:800;color:var(--ink)} .fact .l{font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;color:var(--ink)}

/* forms & buttons */
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filters label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
select,input[type=text],input[type=password],input[type=search],input[type=url],textarea{padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:12.5px}
select{padding-right:6px}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=text],input[type=password],input[type=url]{width:100%}
.search{position:relative;width:100%}
.search input{width:100%;padding:8px 10px 8px 32px;background:var(--surface-2)}
.search svg{position:absolute;left:10px;top:50%;width:14px;height:14px;margin-top:-7px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.btn:hover{border-color:var(--accent);color:var(--ink)}
.btn svg{width:15px;height:15px;flex:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy-2)}
:root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{background:var(--accent);border-color:var(--accent)}}
.btn.ok{color:var(--ok)} .btn.danger{color:var(--high)}
.btn.sel{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-2)}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-bottom:12px}
.field>span{font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{border-color:var(--accent);color:var(--ink)}
.iconbtn svg{width:17px;height:17px}

/* tables */
.scroll{overflow-x:auto;background:var(--surface)}
.card .scroll,.sec .scroll{border:0}
.sec>.scroll,.panel .scroll,#drawer .scroll{border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:10px 14px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line-2)}
th{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--focus)}
th .sort{font-size:9px;color:var(--accent)}
th.r,td.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-tint)}
tbody tr.hot{background:var(--high-bg)}
td b{font-weight:600;color:var(--ink)}
td .chip{white-space:nowrap}
td:first-child>span>b{white-space:nowrap}
td .sub{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.count{font-size:11.5px;color:var(--muted);margin:0;padding:8px 16px;border-bottom:1px solid var(--line-2)}
.sec>div>.count{padding:0 0 8px;border:0}
.more{display:flex;justify-content:center;padding:10px;border-top:1px solid var(--line-2)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.cellbar{display:flex;align-items:center;gap:8px;min-width:120px}
.cellbar b{min-width:3.4ch;text-align:right;font-weight:700}
.cellbar .track{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:50px}
.cellbar .track .bar{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar.high{background:var(--high-dot)!important} .bar.med{background:var(--med-dot)!important} .bar.ok{background:var(--ok)!important}
details.data{margin-top:8px;font-size:12px}
details.data summary{cursor:pointer;color:var(--accent);font-weight:600}
details.data .scroll{margin-top:8px;max-height:300px;border:1px solid var(--line);border-radius:8px}

/* overview: risk list + facility index + gaps */
.rlist{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,150px) 90px}
.rlist>div{padding:10px 16px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:center;min-width:0}
.rlist .h{padding:7px 16px;background:var(--surface-2);font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.rlist .hot{background:var(--high-bg);border-bottom-color:var(--high-row)}
.rlist .p b{font-size:12.5px;font-weight:600} .rlist .p span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .f{font-size:11.5px;color:var(--ink-2)}
.rlist>div.h{padding:7px 16px;background:var(--surface-2);font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.prio{padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.prio:last-child{border-bottom:0}
.prio:hover{background:var(--surface-2)}
.prio-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.prio-top b{display:block;font-size:12.5px;font-weight:600} .prio-top span{display:block;font-size:11px;color:var(--muted)}
.prio-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;flex:none}
.prio-badge.p1{background:var(--high-tint);color:var(--high)} .prio-badge.p2{background:var(--med-tint);color:var(--med)} .prio-badge.p3{background:var(--ok-tint);color:var(--ok)}
.prio-bar{height:5px;background:var(--surface-3);border-radius:3px;overflow:hidden}
.prio-bar i{display:block;height:100%;border-radius:3px}
.gapcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.gapcol{padding:13px 16px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);text-align:left;background:none;border-top:0;border-left:0;font:inherit;color:inherit;cursor:pointer}
.gapcol:hover{background:var(--surface-2)}
.gapcol[aria-pressed="true"]{background:var(--accent-tint)}
.gapcol .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;color:var(--muted)}
.gapcol .v{font-size:26px;font-weight:800;line-height:1;color:var(--ink-2)}
.gapcol .s{font-size:11px;color:var(--muted);margin-top:3px}
.gapcol.high .l,.gapcol.high .v{color:var(--high)} .gapcol.med .l,.gapcol.med .v{color:var(--med)}
.gapcol ul{list-style:none;margin:8px 0 0;padding:0;font-size:11.5px;color:var(--ink-2)}
.gapcol ul li{padding:1px 0} .gapcol ul li.o{color:var(--muted)}

/* patient risk: master-detail */
.md{display:grid;grid-template-columns:360px minmax(0,1fr);gap:0;min-height:calc(100vh - var(--head-h) - 36px);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.md-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.md-tools{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.md-tools .filters{gap:6px}
.md-tools select{flex:1;min-width:0}
.md-tools .seg{display:flex}
.md-tools .seg button{flex:1}
.md-scroll{overflow-y:auto;flex:1;max-height:calc(100vh - var(--head-h) - 200px)}
.grp{padding:9px 16px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface)}
.grp.high{color:var(--high)} .grp.medium{color:var(--med)} .grp.standard{color:var(--ok)}
.pitem{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--line-2);background:none;padding:10px 14px 10px 13px;cursor:pointer;font:inherit;color:inherit}
.pitem:hover{background:var(--surface-2)}
.pitem[aria-current="true"]{background:var(--accent-tint);border-left-color:var(--accent)}
.pitem-top{display:flex;align-items:center;gap:8px}
.pitem-top b{font-size:12.5px;font-weight:700;font-family:var(--mono)}
.pitem-top .lvl{margin-left:auto;font-size:11px}
.pitem .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem-top b.named{font-family:var(--font)}
.ident-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.ident-name{font-size:17px;font-weight:700;margin-bottom:6px}
.ident-form{display:flex;gap:8px;max-width:560px}
.ident-form input{flex:1}
.ident-form[hidden],.ident-box button[hidden]{display:none}
.pitem .done{font-size:10px;color:var(--accent-2);font-weight:700}
.md-detail{background:var(--bg);padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pd-head{display:flex;gap:18px;align-items:flex-start}
.pd-head .who{flex:1;min-width:0}
.pd-id{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pd-id h2{font-size:20px;font-weight:800;font-family:var(--mono);letter-spacing:-.01em}
.pd-meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
.ring{flex:none;text-align:center}
.ring small{display:block;font-size:9.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.ring svg{width:76px;height:76px;display:block;margin:0 auto}
.ring .rv{font-size:20px;font-weight:800}
.ring .ru{font-size:9px;fill:var(--ink-3)}
.ring .rx{font-size:11px;color:var(--muted);margin-top:3px}
.fbar{display:grid;gap:5px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.fbar:last-child{border-bottom:0}
.fbar-top{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink)}
.fbar-top b{font-size:12px;white-space:nowrap}
.fbar-top b.up{color:var(--high)} .fbar-top b.dn{color:var(--ok)}
.fbar .prio-bar{height:6px}

/* duplicates */
.pairs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.pair{padding:14px 16px}
.pair .recs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pair .rec{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;font-size:12px;min-width:0}
.pair .rec b{display:block;font-size:13px;font-family:var(--mono);overflow-wrap:anywhere}
.pair .rec span{display:block;color:var(--muted);font-size:11px}
.pair .p{font-size:22px;font-weight:800}
.pair.decided{opacity:.65}

/* charts */
svg.chart{width:100%;height:auto;display:block}
.ch text{font-family:var(--font)}
.ch .ax text{fill:var(--ink-3);font-size:11px}
.ch .gl{stroke:var(--line-2);stroke-width:1}
.ch .base{stroke:var(--line);stroke-width:1}
.ch .c1{fill:var(--c1)} .ch .c2{fill:var(--c2)} .ch .c0{fill:var(--c0)}
.ch .s1{stroke:var(--c1);fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch .ref{stroke:var(--ink-3);stroke-dasharray:4 4;stroke-width:1;fill:none}
.ch .lbl{fill:var(--ink-2);font-size:11px}
.ch .lblb{fill:var(--ink);font-size:12px;font-weight:700}
.ch .quad{fill:var(--ink-3);font-size:11px;font-weight:600}
.ch .halo{paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.ch .ring{stroke:var(--surface);stroke-width:2}
.ch .hit{fill:transparent;cursor:pointer}
.ch .mk{transition:opacity .12s}
.ch g.pt:hover .mk,.ch g.pt:focus .mk{opacity:.72}
.ch g.pt:focus{outline:none}
.ch g.pt:focus-visible .mk{stroke:var(--focus);stroke-width:3}
.ch .xh{stroke:var(--ink-3);stroke-width:1}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--muted);margin:2px 0 8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px}
.lg i.dot{border-radius:50%} .lg i.line{height:2px;width:16px;border-radius:1px}
.lg i.hollow{border-radius:50%;background:var(--surface);border:2px solid var(--c0)}
.lg i.dash{height:0;width:16px;border-top:2px dashed var(--ink-3);border-radius:0}
.figure{margin:0}
.figure figcaption{font-size:11.5px;color:var(--muted);margin-top:6px}
.forest{display:grid;gap:2px;font-size:12px}
.frow{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(120px,2fr) 64px;gap:12px;align-items:center;padding:4px 6px;border-radius:6px}
.frow[tabindex]:hover,.frow[tabindex]:focus-visible{background:var(--surface-2)}
.frow.hd{font-size:10px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.frow .fl{color:var(--ink-2)} .frow .fv{font-weight:700;text-align:right;white-space:nowrap}
.strip{position:relative;height:20px;min-width:100px}
.strip.db{width:200px;height:22px}
.strip .axisl{position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.strip .refl{position:absolute;top:1px;bottom:1px;border-left:1px dashed var(--ink-3)}
.strip .ci{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--c1);border-radius:1px}
.strip .dt{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 2px var(--surface)}
.strip .dt.c2{background:var(--c2)}
.strip .dt.hol{background:var(--surface);border:2px solid var(--c0);box-shadow:none}
.strip .bx{position:absolute;top:5px;height:10px;background:var(--c1);border-radius:0 3px 3px 0}
.strip .bx.c2{background:var(--c2)} .strip .bx.neg{border-radius:3px 0 0 3px}
.strip .tick{position:absolute;top:1px;bottom:1px;width:2px;margin-left:-1px;background:var(--ink)}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--pop);display:none;max-width:280px}
#tip .tt{font-weight:700;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:7px;white-space:nowrap}
#tip .tr i{width:12px;height:2px;border-radius:1px;flex:none}
#tip .tr b{font-weight:800} #tip .tr span{color:var(--muted)}

/* drawer, dialog, toast */
#drawer{position:fixed;inset:0 0 0 auto;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:60;transform:translateX(102%);transition:transform .2s ease;overflow:auto;padding:18px 20px 28px;box-shadow:var(--pop)}
#drawer.open{transform:none}
#drawer h3{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.drawer-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.drawer-h h2{flex:1;font-size:17px;overflow-wrap:anywhere}
#veil{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55;display:none}
#veil.on{display:block}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:12.5px;z-index:80;max-width:92vw;display:none;box-shadow:var(--pop)}
dialog#login{border:1px solid var(--line);border-radius:12px;padding:0;width:min(420px,94vw);background:var(--surface);color:var(--ink);box-shadow:var(--pop)}
dialog#login::backdrop{background:rgba(15,23,42,.5)}
dialog#login form{padding:22px}
dialog#login h2{font-size:17px;margin-bottom:6px}
.demo-acc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.demo-acc button{font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-family:var(--mono)}
.demo-acc button:hover{border-color:var(--accent)}
.err{color:var(--high);font-size:12px;min-height:1.2em;margin:4px 0 10px}
.ident{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px}

/* workflow: toast action, timeline, checklists, task lists, demo guide, shortcuts */
#toast{align-items:center;gap:14px}
.toast-btn{border:0;background:none;color:var(--accent-soft);font-weight:700;cursor:pointer;padding:2px 4px;font-size:12.5px}
.toast-btn:hover{text-decoration:underline}
.timeline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:4px}
.tl-item{padding:6px 0 10px 14px;position:relative;font-size:12.5px}
.tl-item::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-note{margin-top:4px;padding:6px 10px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:6px;color:var(--ink-2);white-space:pre-wrap}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 12px}
.check{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.check input{margin-top:2px;accent-color:var(--accent)}
.filters .check{color:var(--muted)}
#drawer textarea{margin-top:2px}
.task-list{display:grid}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-2);background:none;padding:11px 16px;cursor:pointer;font:inherit;color:inherit}
.task:last-child{border-bottom:0}
.task:hover{background:var(--surface-2)}
.task-main{min-width:0}
.task-main b{display:block;font-size:12.5px;font-weight:600}
.task-main span{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-go{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.guide{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:linear-gradient(90deg,var(--accent-tint),var(--surface));border:1px solid var(--accent-line);border-radius:10px;padding:12px 14px 12px 16px}
.guide-text{flex:1 1 320px;min-width:0}
.guide-text b{display:block;font-size:13px;color:var(--ink)}
.guide-text span{font-size:12px;color:var(--muted)}
.guide .iconbtn{width:30px;height:30px}
kbd{display:inline-block;min-width:22px;text-align:center;font:600 11px/1.6 var(--mono);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);color:var(--ink);margin-right:4px}
.shortcuts{grid-template-columns:110px 1fr;row-gap:10px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent);color:#fff;padding:8px 14px;border-radius:6px;font-weight:600}
.skip:focus{top:10px}

/* ===================================================================== responsive */
@media (max-width:1100px){
  .cols-15{grid-template-columns:1fr}
  .md{grid-template-columns:300px minmax(0,1fr)}
}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .2s ease;z-index:65}
  #side.open{transform:none}
  #menu-btn{display:inline-grid}
  #head{padding:0 14px}
  .content{padding:14px}
  .foot{padding:4px 14px 24px}
  .md{grid-template-columns:1fr;min-height:0}
  .md-list{border-right:0;border-bottom:1px solid var(--line)}
  .md-scroll{max-height:360px}
  .head-right .pill.hide-sm,.user-chip span{display:none}
  .user-chip{padding:4px}
  .user-chip svg{display:none}
}
@media (max-width:640px){
  .kpi .v{font-size:23px}
  .pair .recs{grid-template-columns:1fr}
  .rlist{grid-template-columns:minmax(0,1fr) 70px}
  .rlist .f,.rlist .a{display:none!important}
  .frow{grid-template-columns:1fr 64px;gap:2px 10px}
  .frow .strip{grid-column:1/-1;grid-row:2}
  .strip.db{width:140px}
  .pd-head{flex-direction:column-reverse}
  .head-right .pill{display:none}
  .cols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#drawer,#side{transition:none}}
@media print{
  #side,#head .head-right,#drawer,#veil,#toast,#umenu,.more,.btn,details.data,#menu-btn{display:none!important}
  #head{position:static}
  body{background:#fff}
  .card,.panel,.kpi{box-shadow:none;break-inside:avoid}
}
</style>
</head>

function hover(node, fn, focusable = true) {

const chartW = () => (innerWidth < 640 ? 420 : 640);
function barChart(data, { h = 230, yfmt = num, every = 1, marker = null, ariaLabel = '' } = {}) {
  const W = chartW(), m = { t: 14, r: 10, b: 30, l: 46 };

  data.forEach((d, i) => { if (i % every === 0) ax.append(sv('text', { x: m.l + bw * i + bw / 2, y: h - 10, 'text-anchor': 'middle' }, d.label)); });

      placed.push({ x0, x1: x0 + w, y: ly });

/* Calibration: mean predicted vs observed risk by decile, with the line of perfect calibration. */
function calibrationChart(deciles) {
  const W = chartW(), H = 300, m = { t: 16, r: 18, b: 44, l: 52 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const top = Math.max(...deciles.map(d => Math.max(d.mean_predicted, d.observed))) * 1.1;
  const tk = ticks(0, top, 4), mx = Math.max(top, tk[tk.length - 1]);
  const X = v => m.l + (v / mx) * iw, Y = v => m.t + ih - (v / mx) * ih;
  const s = sv('svg', { class: 'ch chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Calibration by risk decile' });
  const ax = sv('g', { class: 'ax' });
  tk.forEach(v => ax.append(sv('line', { class: 'gl', x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) }), sv('text', { x: m.l - 8, y: Y(v) + 4, 'text-anchor': 'end' }, pct(v, 0)),
    sv('text', { x: X(v), y: m.t + ih + 16, 'text-anchor': 'middle' }, pct(v, 0))));
  ax.append(sv('text', { x: m.l + iw / 2, y: H - 8, 'text-anchor': 'middle' }, 'Predicted risk (decile average)'));
  ax.append(sv('text', { x: 14, y: m.t + ih / 2, 'text-anchor': 'middle', transform: `rotate(-90 14 ${m.t + ih / 2})` }, 'Observed rate'));
  s.append(ax, sv('line', { class: 'ref', x1: X(0), y1: Y(0), x2: X(mx), y2: Y(mx) }));
  s.append(sv('path', { class: 's1', d: deciles.map((d, i) => (i ? 'L' : 'M') + X(d.mean_predicted) + ',' + Y(d.observed)).join('') }));
  deciles.forEach(d => {
    const g = sv('g', { class: 'pt' }, sv('circle', { class: 'hit', cx: X(d.mean_predicted), cy: Y(d.observed), r: 13 }),
      sv('circle', { class: 'mk c1 ring', cx: X(d.mean_predicted), cy: Y(d.observed), r: 5 }));
    hover(g, () => ({ title: 'Risk decile ' + d.decile, rows: [{ v: pct(d.mean_predicted), k: 'predicted', c: 'var(--c1)' }, { v: pct(d.observed), k: 'observed' }, { v: num(d.n), k: 'patients' }] }));
    s.append(g);
  });
  return s;
}

function cmp(a, b) {
  if (a == null && b == null) return 0; if (a == null) return 1; if (b == null) return -1;

}

// ---------------------------------------------------------------- workflow: care gaps, death audits, my tasks
/* Gap and audit work is saved on the server in live mode and in this browser in snapshot mode. Both modes share the
   same shapes so every view reads state through gapState() and deathState(). */

const AUDIT_FACTORS = {
  delay_in_diagnosis: 'Delay in diagnosis', delay_in_treatment_start: 'Delay in starting treatment', no_nutrition_support: 'No nutrition support (NPY)',
  missed_follow_up: 'Missed follow-up', comorbidity_not_managed: 'Comorbidity not managed (HIV, diabetes)', referral_not_completed: 'Referral not completed',
  drug_resistance_not_detected: 'Drug resistance not detected in time', adverse_drug_reaction: 'Adverse drug reaction',
  patient_or_social_factors: 'Patient or social factors', other: 'Other',
};
const GAP_STATUS = { open: 'Open', assigned: 'Assigned', resolved: 'Resolved' };
const gapKey = g => g.type + ':' + g.rid;
const canWorkGaps = () => S.live ? ['district_officer', 'facility_user', 'field_worker'].includes(S.live.me.role) : (S.role === 'district' || S.role === 'facility');
const canAudit = () => S.live ? S.live.me.role === 'district_officer' : S.role === 'district';

function gapState(g) {
  if (S.live) return { status: g.status || 'open', assignee: g.assignee || null, notes: g.notes || 0 };
  const h = S.gapLocal[gapKey(g)] || [];
  const res = h.find(x => x.action === 'resolved' || x.action === 'reopened');
  const own = h.find(x => x.action === 'assigned');
  const status = res && res.action === 'resolved' ? 'resolved' : own ? 'assigned' : 'open';
  return { status, assignee: own ? own.assignee : null, notes: h.filter(x => x.action === 'note').length };
}
function gapStatusChip(g) {
  const st = gapState(g);
  if (st.status === 'resolved') return el('span', { class: 'chip ok', text: '✓ Resolved' });
  if (st.status === 'assigned') return el('span', { class: 'chip done', text: '→ ' + personLabel(st.assignee) });
  return el('span', { class: 'chip', text: 'Open' });
}
function personLabel(u) {
  if (!u) return '–';
  if (u === me()) return 'Me';
  const m = /^(tu|field)_(.+)$/.exec(u);
  if (m) return `${m[1] === 'tu' ? 'Facility team' : 'Field staff'}, ${facName(m[2].toUpperCase())}`;
  const d = /^dto_(.+)$/.exec(u);
  if (d) return 'District officer';
  return u;
}

async function assignableFor(g) {
  if (S.live) {
    S._assignable = S._assignable || {};
    if (!S._assignable[g.facility]) S._assignable[g.facility] = (await api('/users/assignable?facility_id=' + encodeURIComponent(g.facility))).items;
    return S._assignable[g.facility];
  }
  const out = [];
  const fac = SNAP.facilities.find(f => f.id === g.facility);
  if (fac && fac.pilot) {
    out.push({ username: 'tu_' + g.facility.toLowerCase(), role: 'facility_user', display_name: facName(g.facility) + ' team' });
    out.push({ username: 'field_' + g.facility.toLowerCase(), role: 'field_worker', display_name: 'Field staff, ' + facName(g.facility) });
  }
  out.push({ username: 'dto_' + slug(g.district), role: 'district_officer', display_name: 'District TB Officer, ' + g.district });
  return out;
}

async function gapAction(g, action, assignee, note) {
  const rec = { ts: new Date().toISOString(), username: me(), action, assignee: action === 'assigned' ? assignee : null, note: (note || '').trim() };
  if (S.live) {
    await api(`/referral-gaps/${encodeURIComponent(g.type)}/${encodeURIComponent(g.rid)}/actions`, { method: 'POST', json: { action, assignee: rec.assignee, note: rec.note } });
    if (action === 'assigned') { g.assignee = assignee; if (g.status !== 'resolved') g.status = 'assigned'; }
    if (action === 'resolved') g.status = 'resolved';
    if (action === 'reopened') g.status = g.assignee ? 'assigned' : 'open';
    if (action === 'note') g.notes = (g.notes || 0) + 1;
  } else {
    const k = gapKey(g);
    S.gapLocal[k] = [rec, ...(S.gapLocal[k] || [])];
    storeSet('localStorage', 'gaps', S.gapLocal);
  }
}

async function gapHistory(g) {
  if (S.live) return (await api(`/referral-gaps/${encodeURIComponent(g.type)}/${encodeURIComponent(g.rid)}/history`)).items;

// ================================================================= live API
function api(path, opts = {}) {
  const headers = { Authorization: 'Bearer ' + S.live.token };
  let body;
  if (opts.json) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(opts.json); }
  return fetch(S.live.api + path, { method: opts.method || 'GET', headers, body }).then(async r => {
    if (r.status === 401) { signOut('Your session has expired. Please sign in again.'); throw new Error('Session expired'); }
    if (!r.ok) { let msg = r.statusText; try { const j = await r.json(); msg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) { /* not json */ } throw new Error(msg); }
    return opts.raw ? r : r.json();
  });
}
function defaultApi() {
  if (/^https?:$/.test(location.protocol) && location.pathname.replace(/\/$/, '').endsWith('/app')) return location.origin;
  return storeGet('localStorage', 'api', 'http://localhost:8000');
}

    NAME[it.facility_id] = x.facility_name || NAME[it.facility_id];
    return { id: it.facility_id, name: x.facility_name || it.facility_id, district: it.district, pilot: pilot.includes(it.district), index: it.index_score, index_naive: x.index_raw_score,
      priority: it.priority, drivers: x.drivers || [], cases: x.cases_evaluated, low_data: !!x.low_data, on_treatment: x.on_treatment_now,
      early_death: { shrunk: x.early_death_rate, raw: x.early_death_rate_raw, lo: x.early_death_rate_lo, hi: x.early_death_rate_hi },
      pre_tx_loss: { shrunk: x.pre_treatment_loss, raw: x.pre_treatment_loss_raw }, delay_over_14d: x.diagnosis_to_start_delay, open_referral_rate: x.open_referral_rate,
      missed_follow_up_rate: x.missed_follow_up_rate, median_delay_days: x.median_delay_days, supervision_gap: x.supervision_gap, last_supervision: x.last_supervision_date,
      visits_90d: x.supervision_visits_90d || 0, gaps: gF[it.facility_id] || zeroGaps(),
      oe: o ? { observed: o.observed, expected: o.expected, ratio: o.oe_ratio, p: o.p_excess, flag: o.flag } : null };
  });
  const tr = {}; ((R.trends || {}).items || []).forEach(t => { tr[t.district] = t; });
  const districts = ((R.dist || {}).items || []).map(it => {
    const p = it.planning || {}, o = it.outcomes || p.outcomes || {}, t = tr[it.district] || {};
    return { district: it.district, pilot: pilot.includes(it.district),
      real: { tu_count: p.tu_count, tdc_count: p.tdc_count, expected_patients: p.expected_patients, npy_ds_target: p.npy_ds_target, npy_dr_target: p.npy_dr_target,
        acf_house_visit_target: p.acf_house_visit_target, lab_tests_target: p.lab_tests_target, ppsa_notification_target: p.ppsa_notification_target,
        tribal_action_plan: p.tribal_action_plan, hill_district: p.hill_district, patients_per_tu: p.patients_per_tu, patients_per_tdc: p.patients_per_tdc,
        lab_tests_per_patient: p.lab_tests_per_patient, acf_visits_per_patient: p.acf_visits_per_patient, planning_strain_score: p.planning_strain_score, planning_tier: p.planning_tier },
      synthetic: { outcome_index: o.outcome_index, early_death_rate: o.early_death_rate, early_death_lo: o.early_death_rate_lo, early_death_hi: o.early_death_rate_hi,
        pre_treatment_loss: o.pre_treatment_loss, delay_over_14d: o.diagnosis_to_start_delay, open_referral_rate: o.open_referral_rate, missed_follow_up_rate: o.missed_follow_up_rate,
        cases_evaluated: o.cases_evaluated, on_treatment: o.on_treatment_now, gaps: gD[it.district] || zeroGaps(), qoq_change_pct: t.qoq_change_pct,
        projected_next_quarter: t.projected_next_quarter, projected_lo: t.projected_lo, projected_hi: t.projected_hi, last_quarter: t.last_quarter, demand_flag: t.demand_flag } };
  });
  const mapR = it => ({ key: it.patient_key, list: it.list_type, risk: it.risk, tier: it.tier, reasons: it.reasons || [], facility: it.facility_id, district: it.district,
    day: it.days_since_start, age: it.age, sex: it.sex, dr: it.drug_resistant, rank: it.rank_in_facility });
  const reviewItems = [...((R.r1 || {}).items || []), ...((R.r2 || {}).items || [])];
  const review = reviewItems.map(mapR);
  S.liveActions = {};   // reviews already saved on the server, so status survives a reload
  reviewItems.forEach(it => { if (it.last_action) S.liveActions[it.list_type + ':' + it.patient_key] = { action: it.last_action, note: it.last_note || '', at: it.last_action_at, by: it.last_action_by }; });
  const split = s => s ? String(s).split(',').filter(Boolean) : [];
  const duplicates = ((R.dups || {}).items || []).map(p => ({ id: p.id, p: p.probability, band: p.band, district: p.district, matching: split(p.matching), differing: split(p.differing),
    a: p.record_a, b: p.record_b }));
  const cards = {};
  Object.entries(R.cards || {}).forEach(([k, c]) => {
    const pm = c.performance_holdout || {};
    cards[k] = { model: c.model, version: c.version, algorithm: c.chosen_algorithm, outcome: c.outcome_definition, moment: c.scoring_moment, intended_use: c.intended_use,
      cohort: c.training_cohort, limitations: c.known_limitations || [], baseline_vs_challenger: c.baseline_vs_challenger, thresholds: c.tier_thresholds, reasons_method: c.reasons_method,
      metrics: pm, deciles: pm.decile_calibration || [], subgroups: c.subgroup_performance || [], odds_ratios: c.odds_ratios || {} };
  });
  const death = R.death ? { timing: R.death.timing, factors: R.death.factors || [], addressable: R.death.addressable_share, addressable2: null,
    queue: (R.dqueue || {}).items || [], flagged_facilities: (R.death.facility_oe || []).filter(f => f.flag) } : null;

  S.data = Object.assign({}, SNAP, {
    meta: Object.assign({}, SNAP.meta, { as_of: ov.meta && ov.meta.as_of, source: ov.meta && ov.meta.source, version: ov.meta && ov.meta.version, pilot }),
    districts, facilities, review, gaps, duplicates, cards: Object.keys(cards).length ? cards : SNAP.cards,
    gap_totals: ov.open_gaps || {}, death_audit: death, quality: R.quality || null, tier_counts: null,
    kpi: { on_treatment: ov.on_treatment, pending_dups: ov.pending_duplicate_pairs },
    live: { audit: R.audit ? R.audit.items : null, feedback: R.feedback || null },
  });
}

async function signIn(apiBase, username, password) {
  const base = apiBase.replace(/\/+$/, '');
  const r = await fetch(base + '/auth/token', { method: 'POST', body: new URLSearchParams({ username, password }) });
  if (!r.ok) { let msg = 'Sign-in failed'; try { msg = (await r.json()).detail || msg; } catch (e) { /* ignore */ } throw new Error(msg); }
  const tok = await r.json();
  S.live = { api: base, token: tok.access_token, me: null };
  try { S.live.me = await api('/me'); await activateLive(); }
  catch (e) { S.live = null; throw e; }
  storeSet('sessionStorage', 'session', { api: base, token: tok.access_token });
  storeSet('localStorage', 'api', base);
}
async function activateLive() {
  $('#view').classList.add('busy');
  try {
    await loadLive();
    const me = S.live.me;
    S.role = API_ROLE[me.role] || 'state';
    S.district = me.district || S.district;
    S.facility = me.facility_id || S.facility;
    S.f = {}; S.limit = {};
    if (!roleDef().tabs.includes(S.tab)) S.tab = 'overview';
  } finally { $('#view').classList.remove('busy'); }
  renderAll();
}
function signOut(msg) {
  if (S.live && S.live.token) fetch(S.live.api + '/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + S.live.token } }).catch(() => {});   // revoke server-side; best effort
  S.live = null; S.data = SNAP; S.f = {}; S.limit = {}; S.liveActions = {}; S._assignable = null;
  Object.keys(IDENT).forEach(k => { delete IDENT[k]; });
  storeSet('sessionStorage', 'session', null);
  renderAll();
  if (msg) toast(msg);
}
async function restoreSession() {
  const s = storeGet('sessionStorage', 'session', null);
  if (!s || !s.token) return;
  S.live = { api: s.api, token: s.token, me: null };
  try { S.live.me = await api('/me'); await activateLive(); toast('Signed in as ' + S.live.me.display_name); }
  catch (e) { S.live = null; storeSet('sessionStorage', 'session', null); }
}

function loginDialog() {
  const dlg = $('#login');
  const err = el('p', { class: 'err', role: 'alert' });
  const apiIn = el('input', { type: 'url', name: 'api', required: true, value: defaultApi(), autocomplete: 'url' });
  const userIn = el('input', { type: 'text', name: 'username', required: true, autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false' });
  const passIn = el('input', { type: 'password', name: 'password', required: true, autocomplete: 'current-password' });
  const submit = el('button', { class: 'btn primary', type: 'submit' }, 'Sign in');
  const demo = ['state_admin', 'data_manager', 'dto_dibrugarh', 'dto_kamrup_metro', 'dto_cachar', 'tu_as-dib-tu01', 'field_as-kmm-tu02'];
  const form = el('form', { onsubmit: async e => {
    e.preventDefault(); err.textContent = ''; submit.disabled = true; submit.textContent = 'Signing in…';
    try { await signIn(apiIn.value.trim(), userIn.value.trim(), passIn.value); dlg.close(); toast('Signed in as ' + S.live.me.display_name + '. Showing live data.'); }
    catch (ex) { err.textContent = ex.message === 'Failed to fetch' ? 'Could not reach the API at that address. Is the server running (python -m tbds.cli serve)?' : ex.message; }
    finally { submit.disabled = false; submit.textContent = 'Sign in'; }
  } },

    el('label', { class: 'field' }, el('span', { text: 'API address' }), apiIn),

    err,

  dlg.replaceChildren(form);
  dlg.showModal(); userIn.focus();
}


// ===== 90-shell.js
// ================================================================= shell
const VIEWS = { overview: viewOverview, tasks: viewTasks, districts: viewDistricts, facilities: viewFacilities, review: viewReview, gaps: viewGaps, duplicates: viewDuplicates, deaths: viewDeaths, evidence: viewEvidence };
const NAV = [
  { id: 'overview', icon: 'grid' },
  { id: 'tasks', icon: 'check', badge: c => [c.tasks, 'high'] },
  { id: 'review', icon: 'clock', badge: c => [c.highRisk, 'high'] },
  { id: 'facilities', icon: 'home', badge: c => [c.supervise, 'med'] },
  { id: 'districts', icon: 'map' },
  { id: 'gaps', icon: 'arrow', badge: c => [c.gaps, 'high'] },
  { id: 'duplicates', icon: 'copy', badge: c => [c.dups, ''] },
  { id: 'deaths', icon: 'pulse', badge: c => [c.flagged, ''] },
  { sep: true },
  { id: 'evidence', icon: 'info', sub: true },
];
const pill = (cls, text) => el('span', { class: 'pill hide-sm ' + cls }, el('i'), text);

function navCounts() {
  const sc = scoped();
  return {
    highRisk: new Set(sc.review.filter(p => p.tier === 'high').map(p => p.key)).size,
    supervise: sc.facilities.filter(f => f.priority === 'supervise_first').length,
    gaps: sumGaps(gapCounts()),
    dups: Math.max(0, pendingDups(sc) - (isLive() ? 0 : sc.dups.filter(p => S.decisions[p.id]).length)),
    flagged: sc.flagged.length,
    tasks: roleDef().tabs.includes('tasks') ? myTasks().total : 0,
  };
}
const roleLabel = () => isLive() ? (API_ROLE_LABEL[S.live.me.role] || S.live.me.role) : roleDef().label;
const userName = () => isLive() ? S.live.me.display_name : `Demo · ${roleDef().label}`;
function initials(s) {
  const words = s.replace(/\(.*?\)/g, '').replace(/^Demo · /, '').split(/[\s,]+/).filter(w => /^[A-Za-z]/.test(w));
  return words.slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'U';
}

function goTab(t) {
  if (!roleDef().tabs.includes(t)) return;
  S.tab = t;
  if (location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  closeNav(); render(); window.scrollTo({ top: 0 });
}

function renderSidebar() {
  const c = navCounts(), tabs = roleDef().tabs;
  const scopeLabel = S.role === 'district' ? 'Active district' : S.role === 'facility' ? 'Active facility' : 'Scope';
  const scopeValue = S.role === 'district' ? S.district : S.role === 'facility' ? facName(S.facility) : S.role === 'data' ? 'State-wide · data' : 'Assam · state-wide';
  $('#scope-slot').replaceChildren(el('button', { class: 'scope-box', type: 'button', title: isLive() ? 'Set by your account' : 'Change view', onclick: e => { e.stopPropagation(); openMenu(); } },
    el('small', { text: scopeLabel }), el('b', { text: scopeValue })));
  const items = [];
  NAV.forEach(n => {
    if (n.sep) { items.push(el('div', { class: 'nav-sep' })); return; }
    if (!tabs.includes(n.id)) return;
    const b = n.badge ? n.badge(c) : null;
    items.push(el('button', { class: 'nav-item' + (n.sub ? ' sub' : ''), type: 'button', 'data-tab': n.id, 'aria-current': S.tab === n.id ? 'page' : null, onclick: () => goTab(n.id) },
      icon(n.icon), el('span', { text: TABS[n.id] }), b && b[0] ? el('span', { class: 'nav-badge ' + b[1], text: b[0] > 999 ? '999+' : num(b[0]) }) : null));
  });
  $('#nav').replaceChildren(...items);
}

function renderHeader() {
  $('#crumb').textContent = `Assam NHM · TB Programme · ${roleLabel()}`;
  $('#page-title').textContent = S.title || TABS[S.tab];
  const m = S.data.meta;
  const dataPill = isLive()
    ? el('span', { class: 'pill live hide-sm', title: `Live data from ${S.live.api}` }, el('i'), `Live · ${fmtDate(m.as_of)}`)
    : el('span', { class: 'pill hide-sm', title: 'Pipeline snapshot embedded in this page; works offline' }, el('i'), `Snapshot · ${fmtDate(m.as_of)}`);
  const name = userName();
  const chip = el('button', { class: 'user-chip', type: 'button', 'aria-haspopup': 'dialog', 'aria-expanded': String($('#umenu').classList.contains('open')), title: name,
    onclick: e => { e.stopPropagation(); toggleMenu(); } },
    el('span', { class: 'avatar', text: initials(name) }), el('span', { text: name }), icon('chev'));
  $('#head-right').replaceChildren(...(S.headPills || []), dataPill, chip);
}

function renderMenu() {
  const secs = [];
  secs.push(el('div', { class: 'um-sec um-who' }, el('b', { text: userName() }),
    el('span', { text: isLive() ? `${roleLabel()} · ${S.live.api}` : 'Offline snapshot · actions stay in this browser' })));
  if (!isLive()) {
    secs.push(el('div', { class: 'um-sec' }, el('div', { class: 'um-h', text: 'View as' }),
      el('div', { class: 'um-roles' }, ROLES.map(r => el('button', { type: 'button', 'aria-pressed': String(S.role === r.id), onclick: () => setRole(r.id) }, r.label))),
      S.role === 'district' ? districtPicker() : S.role === 'facility' ? facilityPicker() : null));
    secs.push(el('div', { class: 'um-sec' }, el('button', { class: 'btn primary', type: 'button', style: { width: '100%', justifyContent: 'center' }, onclick: () => { closeMenu(); loginDialog(); } }, icon('user'), 'Sign in for live data')));
  } else {
    secs.push(el('div', { class: 'um-sec um-actions' },
      el('button', { class: 'btn sm', type: 'button', onclick: () => { closeMenu(); activateLive().then(() => toast('Refreshed from the server.')).catch(e => toast('Refresh failed: ' + e.message)); } }, icon('refresh'), 'Refresh'),
      el('button', { class: 'btn sm', type: 'button', onclick: () => { closeMenu(); signOut('Signed out. Showing the snapshot.'); } }, icon('logout'), 'Sign out')));
  }
  const theme = storeGet('localStorage', 'theme', 'auto');
  secs.push(el('div', { class: 'um-sec' }, el('div', { class: 'um-h', text: 'Appearance' }),
    el('div', { class: 'row' }, seg('Theme', { auto: 'Auto', light: 'Light', dark: 'Dark' }, theme, v => { storeSet('localStorage', 'theme', v); applyTheme(); renderMenu(); }),
      el('span', { class: 'grow' }),
      el('button', { class: 'iconbtn', type: 'button', title: 'Print this page', 'aria-label': 'Print this page', onclick: () => { closeMenu(); window.print(); } }, icon('print')))));
  $('#umenu').replaceChildren(...secs);
}
function districtPicker() {
  return el('select', { 'aria-label': 'District', onchange: e => { S.district = e.target.value; resetView(); render(); renderMenu(); } },
    SNAP.districts.map(x => x.district).sort().map(dn => el('option', { value: dn, selected: dn === S.district }, dn + (isPilot(dn) ? ' (pilot)' : ''))));
}
function facilityPicker() {
  return el('select', { 'aria-label': 'Facility', onchange: e => { S.facility = e.target.value; S.district = SNAP.facilities.find(f => f.id === S.facility).district; resetView(); render(); renderMenu(); } },
    SNAP.meta.pilot.map(dn => el('optgroup', { label: dn }, pilotFacilities.filter(f => f.district === dn).map(f => el('option', { value: f.id, selected: f.id === S.facility }, f.name)))));
}
function resetView() { S.f = {}; S.limit = {}; S.sel = null; }
function setRole(id) {
  S.role = id; resetView();
  if (id === 'facility') {
    const fac = SNAP.facilities.find(f => f.id === S.facility);
    if (!fac || !fac.pilot) S.facility = pilotFacilities[0].id;
    S.district = SNAP.facilities.find(f => f.id === S.facility).district;
  }
  if (!roleDef().tabs.includes(S.tab)) S.tab = 'overview';
  render(); renderMenu();
}
function openMenu() { renderMenu(); $('#umenu').classList.add('open'); renderHeader(); const b = $('#umenu button'); if (b) b.focus(); }
function closeMenu() { if (!$('#umenu').classList.contains('open')) return; $('#umenu').classList.remove('open'); renderHeader(); }
function toggleMenu() { if ($('#umenu').classList.contains('open')) closeMenu(); else openMenu(); }
function openNav() { $('#side').classList.add('open'); $('#veil').classList.add('on'); $('#menu-btn').setAttribute('aria-expanded', 'true'); }
function closeNav() {
  if (!$('#side').classList.contains('open')) return;
  $('#side').classList.remove('open'); $('#menu-btn').setAttribute('aria-expanded', 'false');
  if (!$('#drawer').classList.contains('open')) $('#veil').classList.remove('on');
}
function applyTheme() {
  const t = storeGet('localStorage', 'theme', 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
}
function renderFoot() {
  const m = S.data.meta;
  $('#foot').replaceChildren(el('div', { class: 'row' },
    el('span', { text: `Version ${m.version} · data as of ${fmtDate(m.as_of)} · ${num(m.records || SNAP.meta.records)} records · ${m.source === 'synthetic' ? 'synthetic patient data' : 'programme extract'}` }),
    el('span', { class: 'grow' }),
    prov('real'), el('a', { href: m.rop_url || SNAP.meta.rop_url, target: '_blank', rel: 'noopener' }, 'NHM Assam NTEP District RoP 2024-26')),
    el('p', { style: { marginTop: '6px' }, text: (m.notice || SNAP.meta.notice) + ' ' + (isLive() ? `Live data from ${S.live.api}; views and actions are recorded in the audit log.` : 'Snapshot mode: data are embedded in this page and work offline.') }));
}
function render() {
  hideTip();
  S.title = TABS[S.tab]; S.headPills = [];
  let nodes;
  try { nodes = VIEWS[S.tab](); }
  catch (e) { console.error(e); nodes = [callout('stop', el('b', { text: 'This view could not be drawn. ' }), String(e.message || e))]; }
  $('#view').replaceChildren(...[].concat(nodes).flat(Infinity).filter(Boolean));
  renderHeader(); renderSidebar();
  document.title = `${S.title} · TB Decision Support, Assam`;
}
function renderAll() { render(); renderFoot(); if ($('#umenu').classList.contains('open')) renderMenu(); }

// ---------------------------------------------------------------- keyboard
let gPending = 0;
function typing(e) { const t = e.target; return t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)); }
function shortcuts(e) {
  if (e.ctrlKey || e.metaKey || e.altKey || typing(e) || $('#login').open) return;
  if (gPending && Date.now() - gPending < 1200) {
    const to = { o: 'overview', p: 'review', t: 'tasks', g: 'gaps', f: 'facilities', d: 'deaths', e: 'evidence' }[e.key];
    gPending = 0;
    if (to && roleDef().tabs.includes(to)) { e.preventDefault(); goTab(to); }
    return;
  }
  if (e.key === 'g') { gPending = Date.now(); return; }
  if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }
  if (e.key === '/') {
    const box = document.querySelector('#view input[type=search]');
    if (box) { e.preventDefault(); box.focus(); box.select(); }
    return;
  }
  if (S.tab === 'review' && ['j', 'k', 'ArrowDown', 'ArrowUp'].includes(e.key) && !$('#drawer').classList.contains('open')) {
    const order = S.revOrder || [], i = order.indexOf(S.sel);
    const next = order[Math.max(0, Math.min(order.length - 1, i + (e.key === 'j' || e.key === 'ArrowDown' ? 1 : -1)))];
    if (!next || next === S.sel) return;
    e.preventDefault();
    if (order.indexOf(next) >= (S.limit.rev || 40)) S.limit.rev = order.indexOf(next) + 20;
    S.sel = next; render();
    const item = document.querySelector(`.pitem[data-key="${next}"]`);
    if (item) { item.focus({ preventScroll: true }); item.scrollIntoView({ block: 'nearest' }); }
  }
}

// ---------------------------------------------------------------- offline app (served pages only)
/* When the page is served by the API at /app/, register a service worker so it opens offline and can be installed.
   The worker caches only the dashboard page and its icon, never API responses (they contain patient data). */
function registerOfflineApp() {
  if (!/^https?:$/.test(location.protocol) || !location.pathname.startsWith('/app/') || !('serviceWorker' in navigator)) return;
  if (!document.querySelector('link[rel=manifest]')) document.head.append(el('link', { rel: 'manifest', href: 'manifest.webmanifest' }));
  navigator.serviceWorker.register('sw.js', { scope: './' }).catch(err => console.warn('Offline app not available:', err));
}

// ---------------------------------------------------------------- boot
function boot() {
  applyTheme();
  $('#veil').addEventListener('click', () => { closeDrawer(); closeNav(); });
  $('#menu-btn').addEventListener('click', openNav);
  document.addEventListener('click', e => { const m = $('#umenu'); if (m.classList.contains('open') && !e.composedPath().includes(m)) closeMenu(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#umenu').classList.contains('open')) closeMenu();
    else if ($('#drawer').classList.contains('open')) closeDrawer();
    else closeNav();
  });
  window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS[t] && t !== S.tab) goTab(t); });
  window.addEventListener('scroll', hideTip, { passive: true });
  document.addEventListener('keydown', shortcuts);
  registerOfflineApp();
  let narrow = innerWidth < 640;
  window.addEventListener('resize', debounce(() => { if ((innerWidth < 640) !== narrow) { narrow = !narrow; render(); } }, 200));
  const h = location.hash.slice(1);
  if (TABS[h] && roleDef().tabs.includes(h)) S.tab = h;
  renderAll();
  restoreSession();
}
boot();

})();
